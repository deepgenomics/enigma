[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma"
version = "1.0"
description = "Enigma"
authors = [
    {name = "Andrew Jung", email = "andrew.jung@deepgenomics.com"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []  # Leave empty if using conda for dependency management

[project.urls]
Homepage = "https://github.com/deepgenomics/enigma"

# Discover the `enigma` package AND all of its subpackages (enigma.data, enigma.models,
# enigma.models.layers, ...). The previous explicit `packages = ["enigma"]` listed only the
# top-level package, so a regular (non-editable) `pip install` produced a wheel containing just
# enigma/__init__.py and config.py, and `from enigma.data.sequences import ...` failed with
# ModuleNotFoundError at runtime. Editable installs masked this because they point at the source tree.
[tool.setuptools.packages.find]
include = ["enigma*"]